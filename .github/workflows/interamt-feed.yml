name: INTERAMT Feed

on:
  workflow_dispatch:
  schedule:
    # 05:45 UTC = 06:45 Uhr Berlin im Winter, 07:45 Uhr im Sommer
    - cron: '45 5 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node installieren
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright installieren
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: INTERAMT durchsuchen
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const SUCHTEXT = `(soziologie OR sozialwissenschaft OR sozialwissenschaften OR sozialwissenschaftliches OR medienwissenschaft OR medienwissenschaften OR Kommunikationswissenschaften OR Kommunikationswissenschaft OR Kommunikationswissenschaftliches OR kommunikationswissenschaften OR "public health") OR "sozial- oder wirtschaftswissenschaftliches"`;

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const page = await browser.newPage({
              viewport: { width: 1440, height: 1400 }
            });

            await page.goto(
              'https://www.interamt.de/koop/app/stellensuche',
              {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              }
            );

            await page.waitForTimeout(3000);

            const cookieButton = page.getByRole('button', {
              name: 'Cookies akzeptieren'
            });

            if (await cookieButton.isVisible().catch(() => false)) {
              await cookieButton.click();
              await page.waitForTimeout(1000);
            }

            await page.locator(
              'input[name="stellensucheFilterAttributes.plzDistance:PLZ"]'
            ).fill('10999');

            await page.locator(
              'input[name="stellensucheFilterAttributes.plzDistance:stellensucheFilterAttributes.maxEntfernung"]'
            ).fill('50');

            await page.locator(
              'input[name="stellensucheFilterAttributes.suchtextContainer:stellensucheFilterAttributes.suchText"]'
            ).fill(SUCHTEXT);

            await page.getByRole('button', {
              name: 'Detailsuche',
              exact: true
            }).click();

            await page.waitForTimeout(10000);

            const rawRows = await page.locator('a').evaluateAll(as => {
              const results = [];

              for (const a of as) {
                const text = (a.innerText || '').trim();
                const match = text.match(/\b(\d{7})\b/);

                if (!match) continue;

                const tr = a.closest('tr');
                if (!tr) continue;

                const cells = [...tr.querySelectorAll('td')].map(td =>
                  td.innerText.trim().replace(/\s+/g, ' ')
                );

                results.push({
                  id: match[1],
                  cells
                });
              }

              return results;
            });

            const unique = new Map();

            for (const row of rawRows) {
              if (!unique.has(row.id)) {
                unique.set(row.id, row);
              }
            }

            const jobs = [...unique.values()].map(row => {
              const c = row.cells;

              return {
                id: row.id,
                employer: c[1] || '',
                title: c[2] || '',
                grade: c[3] || '',
                pay: c[4] || '',
                location: c[5] || '',
                distance: c[6] || '',
                workplace: c[7] || '',
                posted: c[8] || '',
                deadline: c[9] || '',
                row_text: c.join(' | ')
              };
            });

            const feed = {
              source: 'INTERAMT',
              search: {
                postal_code: '10999',
                radius_km: 50,
                query: SUCHTEXT
              },
              generated_at: new Date().toISOString(),
              visible_results: jobs.length,
              jobs
            };

            fs.writeFileSync(
              'feed.json',
              JSON.stringify(feed, null, 2)
            );

            let md = `# INTERAMT Feed\n\n`;
            md += `Letzte Aktualisierung: ${feed.generated_at}\n\n`;
            md += `Sichtbare Treffer: ${jobs.length}\n\n`;

            for (const job of jobs) {
              md += `## ${job.id} – ${job.title}\n\n`;
              md += `- Arbeitgeber: ${job.employer}\n`;
              md += `- Besoldung: ${job.grade}\n`;
              md += `- Entgelt: ${job.pay}\n`;
              md += `- Ort: ${job.location}\n`;
              md += `- Arbeitsort: ${job.workplace}\n`;
              md += `- Eingestellt: ${job.posted}\n`;
              md += `- Frist: ${job.deadline}\n\n`;
            }

            fs.writeFileSync('feed.md', md);

            console.log(`Feed erstellt: ${jobs.length} sichtbare Treffer`);

            await browser.close();
          })();
          NODE

      - name: Feed ins Repository schreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed.json feed.md

          if git diff --cached --quiet; then
            echo "Keine Änderung."
          else
            git commit -m "Update INTERAMT feed"
            git push
          fi

      - name: Pages-Dateien vorbereiten
        run: |
          mkdir -p _site
          cp feed.json _site/feed.json
          cp feed.md _site/feed.md

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Pages hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
